constants:
  - key: earth_radius_m
    label: 地球の赤道半径
    value: 6378137.0
    source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html
    section: Equatorial radius
  - key: earth_mu_m3s2
    label: 地球の重力定数
    value: 3.9860e14
    source: https://nssdc.gsfc.nasa.gov/planetary/factsheet/earthfact.html
    section: GM
  - key: solar_flux_wm2
    label: 太陽定数
    value: 1366
    source: https://sma.jaxa.jp/TechDoc/Docs/JAXA-JERG-2-310A.pdf
    section: (1) 太陽定数
  - key: albedo_high_ratio
    label: 地球アルベドの上側
    value: 0.40
    source: https://sma.jaxa.jp/TechDoc/Docs/JAXA-JERG-2-310A.pdf
    section: 表 5.1.4（時定数 0.3 から 3 時間の行）
  - key: albedo_low_ratio
    label: 地球アルベドの下側
    value: 0.20
    source: https://sma.jaxa.jp/TechDoc/Docs/JAXA-JERG-2-310A.pdf
    section: 表 5.1.4（時定数 0.3 から 3 時間の行）
  - key: earth_ir_high_wm2
    label: 地球赤外放射の上側
    value: 261
    source: https://sma.jaxa.jp/TechDoc/Docs/JAXA-JERG-2-310A.pdf
    section: 表 5.1.4（時定数 0.3 から 3 時間の行）
  - key: earth_ir_low_wm2
    label: 地球赤外放射の下側
    value: 189
    source: https://sma.jaxa.jp/TechDoc/Docs/JAXA-JERG-2-310A.pdf
    section: 表 5.1.4（時定数 0.3 から 3 時間の行）
  - key: earth_obliquity_deg
    label: 地軸の傾き
    value: 23.45
    source: https://ntrs.nasa.gov/api/citations/20205003902/downloads/Introduction%20to%20Orbital%20Mechanics%20and%20Spacecraft%20Attitudes%20for%20Thermal%20Engineers%20CHARTS%20PDF.pdf
    section: p. 140
  - key: stefan_boltzmann_wm2k4
    label: ステファン・ボルツマン定数
    value: 5.670374419e-8
    source: https://physics.nist.gov/cgi-bin/cuu/Value?sigma
  - key: specific_heat_jpkgk
    label: 衛星全体の比熱
    value: 900
    provisional: true
    notes: Stand-in close to aluminium, which is the main structural material.
  - key: speed_of_light_mps
    label: 光速
    value: 299792458
    source: https://physics.nist.gov/cgi-bin/cuu/Value?c
  - key: rail_width_m
    label: レールの幅
    value: 0.0085
    source: https://www.nasa.gov/wp-content/uploads/2018/01/cubesatdesignspecificationrev14_12022-02-09.pdf
    section: 2.2.5
  - key: aluminium_modulus_pa
    label: アルミのヤング率
    value: 7.0e10
    provisional: true
    notes: Typical value for aluminium alloys. Source still to be confirmed.
  - key: drag_coefficient_ratio
    label: 抗力係数
    value: 2.2
    source: https://www.satcon.jp/archive/prize33/pdf/d3307.pdf
    section: SATEBAL 解析書の軌道解析
  - key: reference_density_kgpm3
    label: 基準高度の大気密度
    value: 3.0e-12
    provisional: true
    notes: Typical order at 400 km. It varies strongly with solar activity. Source to be confirmed.
  - key: reference_altitude_m
    label: 大気密度の基準高度
    value: 400000
    provisional: true
  - key: density_scale_height_m
    label: 大気のスケールハイト
    value: 58000
    provisional: true
    notes: Typical order near 400 km. Source to be confirmed.
