# Stand-in equipment until parts are chosen per mission. The owner accepted rough values here.
# Every number comes from the OPT-CUBE report: masses p. 12, power pp. 17 and 19, surface and
# limits p. 16.
reference_buses:
  - form_factor: 3U
    name: OPT-CUBE の機器構成
    source: https://www.satcon.jp/history/prize22/pdf/22_asj.pdf
    section: pp. 12, 16, 17, 19, 24
    mass_section: p. 12, 表 16
    mass_margin_g: 102.87
    min_consumed_power_mw: 1229
    max_consumed_power_mw: 12586
    surface_absorptivity: 0.92
    surface_emissivity: 0.80
    allowable_min_c: -10
    allowable_max_c: 50
    # S-band downlink D-S4 of 表 39 (p. 24): 50 kbps to the Tohoku station.
    link:
      frequency_hz: 2285000000
      rate_bps: 50000
      transmit_power_db: 20
      transmit_feed_loss_db: 1
      transmit_antenna_gain_db: 0
      pointing_loss_db: 0.2
      receive_antenna_gain_db: 32.2
      receive_feed_loss_db: 1
      noise_density_db: -174.6
      other_loss_db: 1.5
      required_ebno_db: 4.5
      min_elevation_deg: 5
    # p. 13: X-axis load of 表 21 and the allowable stress and safety factor in the text.
    design_load_g: 8.66
    allowable_stress_mpa: 226
    safety_factor: 1.5
    battery_voltage_v: 9.6
    battery_capacity_mah: 2450
    charge_efficiency: 0.692
    # 表 31: 展開自由 and 太陽指向. Paddle cells are 9.8 of the 16.4 groups in 表 30.
    sunlit_power_mw: {free_rotation: 8742.3, sun_pointing: 12667.0}
    paddle_cell_share: {free_rotation: 0.5975609756, sun_pointing: 1.0}
    optical_power_mw: 12586
    optical_hours_per_day: 0.5
    modes:
      - {name: 待機, current_ma: 128.02, hours: {free_rotation: 20.7, sun_pointing: 5.6}}
      - {name: 通信, current_ma: 446.56, hours: {free_rotation: 0.8, sun_pointing: 0.8}}
      - {name: 光通信, current_ma: 1311.04, hours: {free_rotation: 0.5, sun_pointing: 0.5}}
      - {name: 発電, current_ma: 308.02, hours: {free_rotation: 0, sun_pointing: 15.1}}
      - {name: 姿勢制御, current_ma: 790.21, hours: {free_rotation: 2, sun_pointing: 2}}
    parts:
      - {id: MOT, group: ミッション, mass_g: 900}
      - {id: LTS, group: ミッション, mass_g: 42.73}
      - {id: SCC, group: ミッション, mass_g: 19.01}
      - {id: GPS-ANT, group: 姿勢制御, mass_g: 32.54}
      - {id: GPS-R, group: 姿勢制御, mass_g: 33.08}
      - {id: GAS, group: 姿勢制御, mass_g: 8.34}
      - {id: MTQ, group: 姿勢制御, mass_g: 76.6936}
      - {id: ACU, group: 姿勢制御, mass_g: 280.66}
      - {id: SANT, group: 通信, mass_g: 8.34}
      - {id: UANT, group: 通信, mass_g: 17.23}
      - {id: ABU, group: 通信, mass_g: 300}
      - {id: TBU, group: 通信, mass_g: 176.08}
      - {id: STR, group: 構体, mass_g: 1060}
      - {id: DSAP, group: 構体, mass_g: 185.76}
      - {id: DM, group: 展開機構, mass_g: 80.19}
      - {id: BAT, group: 電源, mass_g: 309.4}
      - {id: SCP, group: 電源, mass_g: 152.04}
      - {id: screws, group: その他, mass_g: 150}
      - {id: adhesive, group: その他, mass_g: 50}
  # Based on the published M-Cubed 1U power budget (Table 4), without its COVE payload.
  # Power and battery come from that table. Everything else is a stand-in, so the bus is
  # provisional. Nothing here is scaled from the 3U bus.
  - form_factor: 1U
    name: M-Cubed の電力収支を基にした 1U 構成
    source: https://www.space.pitt.edu/sites/default/files/2024-10/Arnold_AERO12.pdf
    section: Table 4
    mass_section: 質量は暫定値
    provisional: true
    notes: Masses, link values, charge efficiency and the sunlit power split are stand-ins.
    mass_margin_g: 150
    min_consumed_power_mw: 1060
    max_consumed_power_mw: 3413
    # Material values of 表 23 and the electronics limits assumed on p. 16 of the OPT-CUBE report.
    surface_absorptivity: 0.92
    surface_emissivity: 0.80
    allowable_min_c: -10
    allowable_max_c: 50
    link:
      frequency_hz: 437000000
      rate_bps: 9600
      transmit_power_db: 27
      transmit_feed_loss_db: 1
      transmit_antenna_gain_db: 2
      pointing_loss_db: 3
      receive_antenna_gain_db: 14
      receive_feed_loss_db: 1
      noise_density_db: -168.6
      other_loss_db: 3
      required_ebno_db: 10
      min_elevation_deg: 5
    design_load_g: 8.66
    allowable_stress_mpa: 226
    safety_factor: 1.5
    battery_voltage_v: 3.7
    battery_capacity_mah: 4205.4
    charge_efficiency: 0.9
    # 2010 mW read as the orbit average, so about 3300 mW in sunlight. Body-mounted cells only:
    # pointing one face at the Sun gives less than the 1.5 faces a tumbling cube shows on average.
    sunlit_power_mw: {free_rotation: 3300, sun_pointing: 2200}
    paddle_cell_share: {free_rotation: 0, sun_pointing: 0}
    optical_power_mw: 3413
    optical_hours_per_day: 1
    modes:
      - {name: 待機, current_ma: 286.49, hours: {free_rotation: 23, sun_pointing: 23}}
      - {name: 通信と撮影, current_ma: 922.43, hours: {free_rotation: 1, sun_pointing: 1}}
    parts:
      - {id: structure, group: 構体, mass_g: 280}
      - {id: solar-panels, group: 電源, mass_g: 120}
      - {id: batteries, group: 電源, mass_g: 180}
      - {id: cdh, group: データ処理, mass_g: 60}
      - {id: radio, group: 通信, mass_g: 80}
      - {id: antennas, group: 通信, mass_g: 30}
      - {id: camera, group: ミッション, mass_g: 20}
      - {id: magnets, group: 姿勢制御, mass_g: 20}
      - {id: harness, group: その他, mass_g: 60}

# Finishes the design loop may choose from. Values from the OPT-CUBE report, p. 16, 表 23.
surface_finishes:
  - {name: 太陽電池セル, absorptivity: 0.92, emissivity: 0.80, source: "https://www.satcon.jp/history/prize22/pdf/22_asj.pdf", section: "p. 16, 表 23"}
  - {name: 黒塗り, absorptivity: 0.67, emissivity: 0.89, source: "https://www.satcon.jp/history/prize22/pdf/22_asj.pdf", section: "p. 16, 表 23"}
  - {name: カプトン, absorptivity: 0.52, emissivity: 0.76, source: "https://www.satcon.jp/history/prize22/pdf/22_asj.pdf", section: "p. 16, 表 23"}
  - {name: アルミ, absorptivity: 0.26, emissivity: 0.03, source: "https://www.satcon.jp/history/prize22/pdf/22_asj.pdf", section: "p. 16, 表 23"}
